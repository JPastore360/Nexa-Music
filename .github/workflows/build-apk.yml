name: Build Nexa Music v6 APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Nexa Music v6
        run: |
          rm -rf projeto
          mkdir -p projeto
          unzip -o NexaMusic_v6.zip -d projeto
          test -f projeto/NexaMusic_v6/app/build.gradle.kts
          test -f projeto/NexaMusic_v6/app/nexa-test.keystore

      - name: Verify stable signing certificate
        working-directory: projeto/NexaMusic_v6
        run: |
          keytool -list -v -keystore app/nexa-test.keystore -storepass nexa-music-debug -alias nexa | grep -E "SHA1:|SHA256:" || true

      - name: Build Nexa Music v6 APK
        working-directory: projeto/NexaMusic_v6
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          MUSIC_BACKEND_URL: ${{ secrets.MUSIC_BACKEND_URL }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Check APK
        run: |
          ls -lah projeto/NexaMusic_v6/app/build/outputs/apk/debug/

      - name: Upload Nexa Music v6 APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Music-v6-APK
          path: projeto/NexaMusic_v6/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
