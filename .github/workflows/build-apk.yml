name: Build Nexa Music APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Nexa Music project
        run: |
          rm -rf projeto
          mkdir projeto
          unzip -o NexaMusic_v1.zip -d projeto

      - name: Build APK
        working-directory: projeto/NexaMusic_v1
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Music-v1-APK
          path: projeto/NexaMusic_v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
